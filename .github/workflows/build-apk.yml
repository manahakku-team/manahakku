name: Build APK

# Pilot rhythm: every change is built and tested (kept as a build artifact); a public release happens
# on Sundays, or when started by hand for an urgent fix.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 0"      # Sundays 10:11 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check complaint-category detection
        run: node tools/test_detect.js && node tools/test_guide.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Private signing key (from GitHub Secrets, if set)
        env:
          MH_KEYSTORE_B64: ${{ secrets.MH_KEYSTORE_B64 }}
        run: |
          if [ -n "$MH_KEYSTORE_B64" ]; then echo "$MH_KEYSTORE_B64" | base64 -d > app/release.keystore; echo "Using the private release key"; else echo "No private key set: using the shared test key"; fi

      - name: Version
        run: echo "VER=$(tr -d '[:space:]' < version.txt).${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK and Play Store bundle
        env:
          MH_KEYSTORE_PASS: ${{ secrets.MH_KEYSTORE_PASS }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Remove the key file
        if: always()
        run: rm -f app/release.keystore

      - name: Name the files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ManaHakku-v$VER.apk"
          cp app/build/outputs/bundle/release/app-release.aab "ManaHakku-v$VER.aab"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManaHakku-apk
          path: ManaHakku-*.a*

      - name: Publish GitHub release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VER" "ManaHakku-v$VER.apk" "ManaHakku-v$VER.aab" \
            --title "Mana Hakku v$VER" \
            --notes "Android app (Telugu / English, read-aloud, voice input). Download the APK on your phone, open it, and allow installs from this source when Android asks."
