name: Device test
on:
  schedule:
    - cron: "41 3 * * 1"      # Mondays 09:11 IST
  workflow_dispatch:
    inputs:
      api: { description: "Android API level", required: false, default: "36" }
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Latest APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download --repo "${{ github.repository }}" --pattern '*.apk' --output app.apk
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api || '36' }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/device_test.sh
      - name: Keep screenshots
        if: always()
        run: |
          cd out && git init -q -b device && git add -A && git -c user.name=gha -c user.email=gha@users.noreply.github.com commit -qm device && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" device
