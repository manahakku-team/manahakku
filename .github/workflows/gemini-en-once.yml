name: Gemini English take after limit reset
on:
  schedule:
    - cron: "5 8 2 11 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: English take
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICES: Sulafat
          TAKES: "1"
          LANGS: en
        run: |
          python3 tools/promo/gemini_tts.py tools/promo/appeal/spoken.tsv /tmp/out
          ls /tmp/out/*.wav
      - name: Save to the media4 branch
        run: |
          cd /tmp/out && git init -q -b media4 && git add -A
          git -c user.name=tts -c user.email=tts@users.noreply.github.com commit -qm "Gemini English take"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/media4
