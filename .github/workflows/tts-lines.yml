name: Voice-over by sentence
on:
  workflow_dispatch:
    inputs:
      dir: { description: "folder with en.txt and te.txt", default: "tools/promo/appeal2" }
      en_voice: { default: "en-IN-PrabhatNeural" }
      te_voice: { default: "te-IN-MohanNeural" }
      rate: { default: "-8%" }
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: One clip per sentence, so pauses can be placed like a person speaks
        run: |
          pip install -q edge-tts
          D="${{ inputs.dir }}"; mkdir -p /tmp/out
          for L in en te; do
            V="${{ inputs.en_voice }}"; [ $L = te ] && V="${{ inputs.te_voice }}"
            i=0; while IFS= read -r line || [ -n "$line" ]; do [ -z "$line" ] && continue
              edge-tts --voice "$V" --rate="${{ inputs.rate }}" --text "$line" --write-media /tmp/out/$L-$(printf %02d $i).mp3
              printf '%s\t%s\n' "$(printf %02d $i)" "$line" >> /tmp/out/$L-lines.tsv; i=$((i+1)); done < "$D/$L.txt"
          done
          ls -la /tmp/out
      - name: Save to the media2 branch
        run: |
          cd /tmp/out && git init -q -b media2 && git add -A
          git -c user.name=tts -c user.email=tts@users.noreply.github.com commit -qm "Voice-over by sentence $(date -u +%FT%H:%M)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/media2
