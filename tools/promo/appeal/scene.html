<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AT;src:url(fonts/anek-telugu-telugu-600-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D}
@font-face{font-family:AT;src:url(fonts/anek-telugu-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:ATb;src:url(fonts/anek-telugu-telugu-700-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D}
@font-face{font-family:ATb;src:url(fonts/anek-telugu-latin-700-normal.woff2) format('woff2')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(ellipse 70% 38% at 50% 74%,rgba(255,170,70,.20),transparent 70%),linear-gradient(180deg,#141a3a 0%,#1d2552 55%,#2a2343 100%);color:#fff;font-family:AT,sans-serif;display:flex;flex-direction:column;align-items:center}
.brand{margin-top:120px;font-family:ATb;font-size:44px;letter-spacing:1px;color:#ffd27a;opacity:.95}
.brand small{display:block;text-align:center;font-family:AT;font-size:28px;color:#c9cdf0;letter-spacing:0;margin-top:6px}
.mid{flex:1;display:flex;align-items:center;justify-content:center;padding:0 90px}
.cap{font-size:86px;line-height:1.28;text-align:center;font-family:ATb;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.cap.long{font-size:70px}
.candle{width:70px;height:220px;margin-bottom:170px;position:relative}
.candle .w{position:absolute;bottom:0;left:15px;width:40px;height:150px;border-radius:8px;background:linear-gradient(90deg,#eee 0%,#fff 40%,#ddd 100%)}
.candle .f{position:absolute;bottom:150px;left:20px;width:30px;height:62px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff6d0 0%,#ffcf5a 45%,#ff8a1f 80%,transparent 82%);box-shadow:0 0 60px 30px rgba(255,170,60,.35)}
.end{font-size:58px;line-height:1.35;text-align:center;font-family:AT}
.end b{font-family:ATb;color:#ffd27a}
.until{margin-top:26px;font-size:46px;font-family:ATb;color:#ffd27a}
.url{margin-top:40px;font-size:40px;color:#c9cdf0;font-family:AT}
.help{margin-top:46px;font-size:40px;font-family:ATb;color:#fff;background:rgba(214,64,64,.35);border:2px solid rgba(255,120,120,.7);padding:18px 30px;border-radius:20px;display:inline-block}
</style></head><body><div class="brand" id="brand"></div><div class="mid"><div id="body"></div></div><div class="candle"><div class="w"></div><div class="f"></div></div>
<script>
const q=new URLSearchParams(location.search);const lang=q.get('lang');
document.getElementById('brand').innerHTML=lang==='te'?'మన హక్కు<small>Mana Hakku</small>':'Mana Hakku<small>మన హక్కు</small>';
const b=document.getElementById('body');
if(q.get('end')){const tt=q.get('t')||'';b.innerHTML=(tt?'<div class="cap" style="font-size:74px;margin-bottom:56px" id="tt"></div>':'')+(lang==='te'?'<div class="end">మన హక్కు → <b>హోమ్</b><br>“మీ ఆలోచనే సమాజానికి కావాల్సిన మార్పుకు నాంది కావచ్చు”<div class="until">నవంబర్ 14 వరకు</div><div class="url">manahakku-team.github.io/manahakku</div><div class="help">ప్రమాదంలో: 112 · మహిళలు 181 · పిల్లలు 1098</div></div>':(tt?'<div class="cap" style="font-size:74px;margin-bottom:56px" id="tt"></div>':'')+'<div class="end">Mana Hakku → <b>Home</b><br>“Your idea can be the start of the change society needs”<div class="until">Until 14 November</div><div class="url">manahakku-team.github.io/manahakku</div><div class="help">In danger: 112 · Women 181 · Children 1098</div></div>');const e=document.getElementById('tt');if(e)e.textContent=tt}
else{const t=q.get('t');b.innerHTML='<div class="cap'+(t.length>60?' long':'')+'"></div>';b.firstChild.textContent=t}
</script></body></html>
